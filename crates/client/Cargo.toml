[package]
name = "p19-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# `tracy` is opt-in, not part of `default`: `bevy/trace_tracy` makes `tracy-client` buffer every
# instrumented span in memory, and that buffer only drains once an actual Tracy GUI connects and
# pulls it out — with nothing connected it grows without bound (Bevy's own `bevy_log` warns about
# exactly this: "Tracing with Tracy is active, memory consumption will grow until a client is
# connected"). Compiling it in unconditionally meant *every* normal play session — not just
# deliberate profiling ones — was one un-attached Tracy GUI away from a multi-GB/s runaway; a real
# incident this caused: `cargo run -p p19-client --release` without Tracy open ran the RSS from ~9GiB
# to 40+GiB in under 4 minutes and kept climbing at ~150MB/s until the process was killed. Build
# with `--features tracy` specifically when you intend to actually attach Tracy and keep it
# attached; a normal `cargo run -p p19-client` build no longer has this instrumentation at all.
[features]
tracy = ["bevy/trace_tracy"]
# The agent/QA tool surface (ADR 0009): BRP (the Bevy Remote Protocol — JSON-RPC over HTTP on
# localhost:15702) + an in-process MCP server (rmcp, Streamable HTTP on localhost:15703) whose
# tools proxy to BRP. NEVER enable in player-facing builds — the client is untrusted in this
# architecture (the server is authoritative), and a tool API in it is a cheat surface; this
# feature exists for dev/QA builds only, same discipline as the `tracy` feature above.
dev-tools = [
    "bevy/bevy_remote",
    "dep:bevy_mcp_harness",
    "dep:schemars",
]

[dependencies]
fluent.workspace = true
noiz.workspace = true
rustls.workspace = true
sha2.workspace = true
bevy.workspace = true
avian3d.workspace = true
bevy_skein.workspace = true
bevy_enhanced_input.workspace = true
bevy_ahoy.workspace = true
bevy_asset_loader.workspace = true
bevy_common_assets.workspace = true
bevy_hanabi.workspace = true
bevy_mod_outline.workspace = true
bevy_vello.workspace = true
bevy_seedling.workspace = true
audionimbus.workspace = true
chill_bevy_console.workspace = true
p19-shared = { path = "../shared" }
bevy_simple_text_input = "0.15.0"
futures-lite = "2.6.1"
serde.workspace = true
toml = "0.9"
# `bevy-steamworks` re-exports the underlying `steamworks` crate's types directly (everything
# except its `Client`, which it wraps as its own Bevy resource) — no separate direct dependency on
# `steamworks` itself is needed. `steamworks-sys` (its transitive dependency) vendors the
# Steamworks SDK's redistributable binaries and headers directly in the published crate, so this
# builds out of the box with no `STEAM_SDK_LOCATION` env var or separate SDK download needed.
# Client-only (platform/presentation-layer integration, not simulation) — `server`/`shared` don't
# need it.
bevy-steamworks = "0.17.0"

bevy_mod_openxr = "0.6"
bevy_xr_utils = "0.6"
bevy_mod_xr = "0.6"

bevy_vrm1 = "0.9.2"
openxr = "0.21.1"
bevy_fluent.workspace = true
fluent_content.workspace = true
unic-langid.workspace = true
bevy_markup.workspace = true
quick-xml.workspace = true
ron.workspace = true
lightyear.workspace = true
lightyear_avian3d.workspace = true
lightyear_inputs_bei = { workspace = true, features = ["client"] }
# --- agent tool API (dev-tools feature, ADR 0009): the generic half (BRP server, the
# game-agnostic `game/*` methods, the MCP server + built-in tools, the bundled agent guides)
# lives in bevy_mcp_harness; `dev/tool_api.rs` adds p19's game-specific methods/tools on top.
bevy_mcp_harness = { version = "0.2.1", optional = true }
# `inject_input`'s MCP-tool argument schema derives from schemars (the harness re-exports the
# crate for non-derive use, but derive macros expand to `schemars::` paths, so the host needs
# the dep itself).
schemars = { version = "1.0", optional = true }
# `bevy_markup`'s `ElementSignal` payloads (`data-with`) are `serde_json::Value`s.
serde_json = "1"
