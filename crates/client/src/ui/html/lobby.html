<html class="screen-root">
<div class="panel lobby-panel">
  <div class="button primary" id="play" autofocus data-on-click="lobby.play"
       data-on-enter="tooltip" data-on-leave="tooltip"
       data-with='{"tooltip": "lobby-play-tooltip"}'>
    <p data-l10n-id="lobby-play">Play</p>
  </div>
  <div class="button" id="level" data-on-click="selector.toggle"
       data-on-enter="tooltip" data-on-leave="tooltip"
       data-with='{"selector": "lobby.level", "tooltip": "lobby-level-tooltip", "tooltip_above": true}'>
    <p data-l10n-id="lobby-level">Level</p>
  </div>
  <div class="button" id="main-menu" data-on-click="lobby.main-menu"
       data-on-enter="tooltip" data-on-leave="tooltip"
       data-with='{"tooltip": "lobby-main-menu-tooltip"}'>
    <p data-l10n-id="lobby-main-menu">Main Menu</p>
  </div>
</div>
</html>
