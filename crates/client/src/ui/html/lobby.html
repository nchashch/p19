{% include "components.html" %}
<html class="screen-root">
<div class="panel lobby-panel">
  {{ <ui.button id="play" class="primary" autofocus={true} signal="lobby.play"
                key="lobby-play" label="Play" tooltip="lobby-play-tooltip" /> }}
  {{ <ui.selector_toggle id="level" selector="lobby.level" key="lobby-level" label="Level"
                         tooltip="lobby-level-tooltip" placement="above" /> }}
  {{ <ui.button id="main-menu" signal="lobby.main-menu" key="lobby-main-menu" label="Main Menu"
                tooltip="lobby-main-menu-tooltip" /> }}
</div>
</html>
