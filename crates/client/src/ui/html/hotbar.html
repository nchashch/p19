{# Ability letters and hotkeys stand in for icons until an icon/inventory asset system exists. #}
<html class="hotbar-root">
<div class="hotbar">
  <div class="hotbar-slot" id="hotbar-attack"
       data-tooltip="hud-attack-tooltip" data-tooltip-args='{"damage": {{ damage }}, "range": {{ attack_range }}}' data-tooltip-placement="above">
    <div class="hotbar-slot-face">
      <p class="hotbar-ability">A</p>
      <p class="hotbar-hotkey">f</p>
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-kill"
       data-tooltip="hud-kill-tooltip" data-tooltip-args='{"range": {{ attack_range }}}' data-tooltip-placement="above">
    <div class="hotbar-slot-face">
      <p class="hotbar-ability">K</p>
      <p class="hotbar-hotkey">t</p>
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-spawn-npc"
       data-tooltip="hud-spawn-npc-tooltip" data-tooltip-placement="above">
    <div class="hotbar-slot-face">
      <p class="hotbar-ability">N</p>
      <p class="hotbar-hotkey">r</p>
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-spawn-cube"
       data-tooltip="hud-spawn-cube-tooltip" data-tooltip-placement="above">
    <div class="hotbar-slot-face">
      <p class="hotbar-ability">C</p>
      <p class="hotbar-hotkey">e</p>
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-empty-0">
    <div class="hotbar-slot-face">
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-empty-1">
    <div class="hotbar-slot-face">
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-empty-2">
    <div class="hotbar-slot-face">
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
  <div class="hotbar-slot" id="hotbar-empty-3">
    <div class="hotbar-slot-face">
      <div class="hotbar-gcd" is="gcd-overlay"></div>
    </div>
  </div>
</div>
</html>
