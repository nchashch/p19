{# The options screen (`ui/ui.rs`): a modal over the main menu (`ui/menu_screen.rs`) holding the
   settings. Only Language so far; its popup opens beside the toggle. #}
{% include "components.html" %}
<html class="menu-screen-root">
<div class="panel menu-screen-panel">
  <h1 data-l10n-id="options-title">Options</h1>
  {{ <ui.selector_toggle id="language" selector="main-menu.language" key="main-menu-language" label="Language"
                         tooltip="options-language-tooltip"
                         placement="above" /> }}
  {{ <ui.button id="options-back" class="primary" autofocus={true} signal="menu-screen.back"
                key="menu-screen-back" label="Back" /> }}
</div>
</html>
