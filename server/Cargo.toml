[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Declared directly (not via workspace = true) since this needs a different, smaller feature set
# than the client's `[workspace.dependencies] bevy` entry — Cargo doesn't allow overriding
# default-features on an inherited workspace dependency.
#
# `bevy_gltf` is the one feature actually needed to load `.glb` level geometry headlessly — it
# transitively pulls in `bevy_world_serialization` too (see bevy_internal's Cargo.toml:
# `bevy_gltf = ["dep:bevy_gltf", "bevy_world_serialization", "bevy_pbr?/bevy_gltf"]`, and that
# last one is a *weak* dep, so it does NOT drag in `bevy_pbr`/rendering). Neither `bevy_gltf` nor
# `bevy_world_serialization` nor `bevy_skein` depend on `bevy_render`/`bevy_pbr`/`bevy_scene` at
# all — the whole Skein/world-asset pipeline is render-independent by design.
bevy = { version = "0.19.0", default-features = false, features = [
	"bevy_gltf",
	# The level's GLTF materials reference PNG/KTX2 textures — `GltfLoader` decodes every
	# referenced image as part of loading the whole scene (even though the server never samples
	# them), so a missing image format fails the *entire* asset load, not just that one texture.
	"png",
	# KTX2/UASTC-compressed textures (see `scripts/glbpack.sh`'s `-tu` flag and the workspace root
	# `Cargo.toml`'s `[patch.crates-io]`/`shared`'s `gltf` feature-forcing comment for the client
	# side of this) need both features to even *parse*, not just to render: `GltfPlugin::finish()`
	# has no `CompressedImageFormatSupport` resource to read here (no `bevy_render`, headless), so
	# it falls back to `CompressedImageFormats::NONE` — meaning the UASTC transcode this still
	# requires (`basis-universal`) always lands on the plain `Rgba8Unorm` fallback rather than a
	# real GPU-compressed format, which is fine: the server only needs a valid in-memory `Image` to
	# finish loading the document, it never uploads or samples the result.
	"ktx2",
	"basis-universal",
	# `gltfpack`/`ktx` also Zstd-supercompress the KTX2 container itself on top of the UASTC data
	# (see `scripts/glbpack.sh`/`hdri_to_skybox.py`) — decoding that needs a zstd backend too,
	# separately from the format/transcode features above. `zstd_rust` (pure-Rust `ruzstd`) over
	# `zstd_c` (unsafe C bindings) for the same "safe by default" reason `bevy`'s own Cargo.toml
	# recommends it. On the client this comes along for free, incidentally, via `bevy_mod_outline`/
	# `bevy_enhanced_input` requesting it on their own `bevy` dependency — neither is a `server`
	# dependency, so it has to be requested explicitly here instead.
	"zstd_rust",
	# `bevy_world_serialization`'s spawner reflects every component (including built-ins like
	# `Transform`) onto the entities it instantiates, and panics on any type missing from the
	# `AppTypeRegistry`. The client never registers `Transform` itself either — it gets this for
	# free through `reflect_auto_register`, nested inside `default_app` -> `3d`/`2d` -> `default`,
	# which only fires because the client uses `default-features = true`.
	"reflect_auto_register",
	# Needed by `bevy_enhanced_input`'s own `serialize` feature (see the workspace `Cargo.toml`
	# comment on that dependency) — `server::replay`'s recorder round-trips `ActionValue`
	# through JSON.
	"serialize",
	# Server-side BRP + MCP debugging surface (`server::tools`) — always-on (localhost-only,
	# the server is trusted, unlike the client where it's feature-gated as a cheat surface).
	"bevy_remote",
] }
avian3d.workspace = true
noiz.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
sha2.workspace = true
bevy_asset_loader.workspace = true
bevy_common_assets.workspace = true

# Agent tool API: in-process MCP server (rmcp, Streamable HTTP) whose tools proxy to the
# server's own BRP over loopback — the same shape as the client's `dev::tool_api`, minus
# everything client-specific (input mocking, screenshots, UI dumps).
rmcp = { version = "3.4", features = [
	"server",
	"macros",
	"schemars",
	"transport-streamable-http-server",
] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }
serde_json = "1"
serde.workspace = true

lightyear.workspace = true
lightyear_inputs_bei = { workspace = true, features = ["server"] }
bevy_ahoy.workspace = true
bevy_enhanced_input.workspace = true

bevy_skein.workspace = true
shared = { path = "../shared" }
