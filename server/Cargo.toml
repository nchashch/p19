[package]
name = "server"
version.workspace = true
edition.workspace = true

[dependencies]
# Declared directly (not via workspace = true) since this needs a different, smaller feature set
# than the client's `[workspace.dependencies] bevy` entry — Cargo doesn't allow overriding
# default-features on an inherited workspace dependency.
#
# `bevy_gltf` is the one feature actually needed to load `.glb` level geometry headlessly — it
# transitively pulls in `bevy_world_serialization` too (see bevy_internal's Cargo.toml:
# `bevy_gltf = ["dep:bevy_gltf", "bevy_world_serialization", "bevy_pbr?/bevy_gltf"]`, and that
# last one is a *weak* dep, so it does NOT drag in `bevy_pbr`/rendering). Neither `bevy_gltf` nor
# `bevy_world_serialization` nor `bevy_skein` depend on `bevy_render`/`bevy_pbr`/`bevy_scene` at
# all — the whole Skein/world-asset pipeline is render-independent by design.
bevy = { version = "0.19.0", default-features = false, features = [
	"bevy_gltf",
	# The level's GLTF materials reference PNG textures — `GltfLoader` decodes every referenced
	# image as part of loading the whole scene (even though the server never samples them), so a
	# missing image format fails the *entire* asset load, not just that one texture.
	"png",
	# `bevy_world_serialization`'s spawner reflects every component (including built-ins like
	# `Transform`) onto the entities it instantiates, and panics on any type missing from the
	# `AppTypeRegistry`. The client never registers `Transform` itself either — it gets this for
	# free through `reflect_auto_register`, nested inside `default_app` -> `3d`/`2d` -> `default`,
	# which only fires because the client uses `default-features = true`.
	"reflect_auto_register",
] }
avian3d.workspace = true
bevy_replicon.workspace = true
bevy_replicon_quinnet.workspace = true
bevy_quinnet.workspace = true
bevy_skein.workspace = true
shared = { path = "../shared" }
