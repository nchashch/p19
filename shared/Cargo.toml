[package]
name = "shared"
version.workspace = true
edition.workspace = true

[dependencies]
# Declared directly, not via workspace = true — see server/Cargo.toml for why.
bevy = { version = "0.19.0", default-features = false }
avian3d.workspace = true
noiz.workspace = true
lightyear.workspace = true
serde.workspace = true
ron.workspace = true
bevy_asset_loader.workspace = true
# Not used directly — present purely to force Cargo's feature unification. `bevy_gltf`
# (crates.io, transitive) depends on `gltf` with `default-features = false` and an explicit
# feature list that doesn't include `KHR_texture_basisu`, so without a dependent somewhere in the
# graph requesting it, `bevy_gltf::loader::GltfLoader` fails to load any `.glb` with
# `extensionsRequired: ["KHR_texture_basisu"]` (see the root `Cargo.toml`'s `[patch.crates-io]`
# for the vendored `gltf` fork this feature lives in). Declared here, not per-binary, so both
# `client` and `server` — which both parse the same `.glb` files independently, see the "Server"
# section of CLAUDE.md — pick it up from a single place.
gltf = { version = "1.4.0", default-features = false, features = [
	"KHR_texture_basisu",
] }
