[workspace]
resolver = "2"
members = ["client", "server", "shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Debug symbols in the release profile so Tracy (see `client`'s `bevy/trace_tracy` feature) shows
# real function names instead of addresses. Cargo profiles are workspace-wide, not per-member, so
# this also applies to `server`'s release build — harmless there (bigger binary, no behavior
# change), since `server` doesn't enable `trace_tracy` itself.
[profile.release]
debug = true

[workspace.dependencies]
bevy_fluent = "0.15"
fluent = "0.16.0"
fluent_content = "0.0.5"
unic-langid = { version = "0.9.6", features = ["macros"] }
noiz = "0.5.0"
bevy = { version = "0.19.0", default-features = true, features = [
	"serialize",
	"basis-universal",
	"ktx2",
	"bevy_dev_tools",
	"bevy_feathers",
	# Lets `parley` (Bevy 0.19's text-shaping stack — see `parley_context.rs`'s `FontCx`) fall back
	# to fonts discovered on the host system when the explicitly-set UI font (`CommonAssets.
	# serif_font`, IBM Plex Serif — Latin/Cyrillic only) lacks a glyph a string actually needs, e.g.
	# Japanese kana/kanji. Only `client` renders text at all — `server`/`shared` declare their own
	# separate, smaller `bevy` feature set (see AGENTS.md's dependency-layout notes), so this only
	# affects `client`. Worth knowing: this makes CJK *readable on a dev machine that happens to
	# have a CJK-capable font installed* (confirmed present here: Noto Sans CJK under
	# `/usr/share/fonts/noto-cjk/`) — it is not a substitute for actually bundling a CJK font asset
	# for the shipped game, since a player's machine has no such guarantee.
	"system_font_discovery",
] }
avian3d = { version = "0.7.0", features = ["simd", "serialize"] }
bevy_skein = "0.6.0"
bevy_enhanced_input = "0.26.0"
bevy_asset_loader = { version = "0.27.0", features = [
	"standard_dynamic_assets",
] }
# For loading custom `.ron` (and other data-format) asset types directly, independent of
# `bevy_asset_loader`'s own dynamic-asset manifests — see `RonAssetPlugin`. Pinned to the same
# 0.17.0 `bevy_asset_loader` already pulls in transitively (it uses this crate internally for
# `common_assets.assets.ron`/level manifests), so there's only ever one version in the dependency
# graph. `default-features = false` since this crate has no `default` feature set of its own to
# begin with — every format (`ron`, `json`, `yaml`, ...) is opt-in.
bevy_common_assets = { version = "0.17.0", default-features = false, features = [
	"toml",
	"ron",
] }
bevy_hanabi = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }

polyanya = { path = "../polyanya" }
rerecast = { path = "../rerecast/crates/rerecast" }
bevy_mod_outline = { path = "../bevy_mod_outline" }
bevy_vello = { path = "../bevy_vello" }
bevy_seedling = { path = "../bevy_seedling", features = ["mp3"] }
audionimbus = { path = "../audionimbus/audionimbus", features = [
	"bevy",
	"auto-install",
] }
chill_bevy_console = "0.3.1"
quick-xml = "0.42.0"
# Kinematic character controller (Bevy + Avian + BEI). Wired into `client` ahead of the
# character-controller rewrite (see `AGENTS.md`'s top-of-file gap note); nothing uses it yet.
# `default-features = false` because the only default feature, `pickup`, would pull in
# `avian_pickup` and make `AhoyPlugins` auto-register `AvianPickupPlugin` + `AhoyPickupGluePlugin`
# — an interaction system beyond the controller wiring wanted so far. Members can't override
# `default-features` on a `workspace = true` reference, so it's disabled here; re-enable here if
# pickup gameplay is ever wanted. 0.2.x is the release line matching this workspace's `bevy` 0.19
# / `avian3d` 0.7 / `bevy_enhanced_input` 0.26 (0.0.x and 0.1.x target older Bevy).
bevy_ahoy = { version = "0.2.0", default-features = false }
# For hand-rolled `AssetLoader` impls that need `ron` directly (e.g. `CharacterAssetLoader`,
# parsing to an intermediate string-path struct before resolving each field via
# `LoadContext::load`) rather than going through `RonAssetPlugin`/`bevy_common_assets`. Pinned to
# 0.12.1 specifically to reuse the version `bevy_asset`/`bevy_world_serialization` themselves
# already resolve to (see `Cargo.lock`), not the older 0.11.0 `bevy_common_assets` pins for its
# *own*, unrelated internal use — either avoids a third `ron` version entering the graph, but 0.12.1
# piggybacks on a dependency edge that's already there for reasons unrelated to `bevy_common_assets`.
ron = "0.12.1"

# `input_bei` activates the meta-crate's own `dep:lightyear_inputs`/`dep:lightyear_inputs_bei`
# edges, which is what makes its `prediction` feature's `lightyear_inputs?/prediction`
# passthrough actually apply — without it, `lightyear_inputs` builds without `prediction`,
# its `LastConfirmedInputPlugin` is compiled out, and `LastConfirmedInput` is never
# initialized (client panics at connect). Our direct `lightyear_inputs_bei` dep below only
# provides the import path + per-binary `client`/`server` features; it does NOT feed the
# meta-crate's `?` passthroughs.
lightyear = { version = "0.30.0", features = ["avian3d", "udp", "netcode", "input_bei", "debug"] }
lightyear_avian3d = "0.30.0"
# BEI-action input replication — the missing piece that un-blocks lightyear's `PredictionPlugin`
# (which hard-depends on one of the `lightyear_inputs_*` plugins having initialized
# `LastConfirmedInput`). Registered via `shared::inputs::SharedInputsPlugin` on both binaries;
# each member enables its own `client`/`server` feature on top of this entry. Already present
# in `Cargo.lock` at 0.30.0 as a transitive dep, so this adds no version churn.
lightyear_inputs_bei = "0.30.0"

# `gltf` (transitive, via `bevy`/`bevy_gltf`) is patched to a vendored fork with
# https://github.com/gltf-rs/gltf/pull/467 applied, adding support for `KHR_texture_basisu`
# (KTX2/Basis Universal compressed textures embedded in `.glb`) — not merged upstream yet.
# `gltf-json`/`gltf-derive` don't need their own patch entries: `../gltf`'s own Cargo.toml
# references them as workspace-local path dependencies, not crates.io ones.
[patch.crates-io]
gltf = { path = "../gltf" }
