[workspace]
resolver = "2"
members = ["client", "server", "shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Debug symbols in the release profile so Tracy (see `client`'s `bevy/trace_tracy` feature) shows
# real function names instead of addresses. Cargo profiles are workspace-wide, not per-member, so
# this also applies to `server`'s release build — harmless there (bigger binary, no behavior
# change), since `server` doesn't enable `trace_tracy` itself.
[profile.release]
debug = true

[workspace.dependencies]
bevy_fluent = "0.15"
fluent = "0.16.0"
fluent_content = "0.0.5"
unic-langid = { version = "0.9.6", features = ["macros"] }
noiz = "0.5.0"
bevy = { version = "0.19.0", default-features = true, features = [
	"serialize",
	"basis-universal",
	"ktx2",
	"bevy_dev_tools",
	"bevy_feathers",
] }
avian3d = { version = "0.7.0", features = ["simd", "serialize"] }
bevy_skein = "0.6.0"
bevy_enhanced_input = "0.26.0"
bevy_asset_loader = { version = "0.27.0", features = ["standard_dynamic_assets"] }
bevy_hanabi = "0.19.0"
bevy_replicon = "0.41.1"
# `recv_channels` (a default feature) adds an alternate auto-dispatch receive path that
# `bevy_replicon_quinnet` doesn't use (it dequeues messages itself) — left off since nothing
# else in this workspace needs it either.
bevy_quinnet = { version = "0.21.0", default-features = false, features = [
	"client",
	"server",
	"shared-client-id",
] }
serde = { version = "1.0.228", features = ["derive"] }

polyanya = { path = "../polyanya" }
rerecast = { path = "../rerecast/crates/rerecast" }
bevy_mod_outline = { path = "../bevy_mod_outline" }
# Vendored to fix a real reconnect bug: `RepliconQuinnetClientPlugin` registers
# `set_connected`/`set_connecting`/`set_disconnected` as an unordered tuple in `PreUpdate`, all
# writing to the same `NextState<ClientState>`. On a fast enough connection (confirmed on
# loopback, especially a *second* connection in the same process — presumably faster than the
# first since the OS/crypto context is already warmed up), `client_connecting` and
# `client_just_connected` can both be true in the same frame; whichever of
# `set_connecting`/`set_connected` happens to run last that frame wins, since `NextState` only
# holds one pending value. If `set_connecting` wins, `ClientState` gets stuck reporting
# `Connecting` forever — worse, `bevy_quinnet::client_just_connected`'s own internal `Local<bool>`
# edge-detector already flipped to "connected" on the losing frame regardless of whose write won,
# so it can never fire `set_connected` again for the rest of the process, even though the
# underlying QUIC connection is genuinely fully connected. Symptom: `OnEnter(ClientState::Connected)`
# silently stops firing on any reconnect after the first, while `bevy_quinnet`'s own low-level
# "connection established" log line (unrelated to this broken edge-detector) still prints fine.
bevy_replicon_quinnet = { path = "../bevy_replicon_quinnet" }
bevy_vello = { path = "../bevy_vello" }
bevy_seedling = { path = "../bevy_seedling", features = ["mp3"] }
audionimbus = { path = "../audionimbus/audionimbus", features = [
	"bevy",
	"auto-install",
] }
chill_bevy_console = "0.3.1"
quick-xml = "0.42.0"

# `gltf` (transitive, via `bevy`/`bevy_gltf`) is patched to a vendored fork with
# https://github.com/gltf-rs/gltf/pull/467 applied, adding support for `KHR_texture_basisu`
# (KTX2/Basis Universal compressed textures embedded in `.glb`) — not merged upstream yet.
# `gltf-json`/`gltf-derive` don't need their own patch entries: `../gltf`'s own Cargo.toml
# references them as workspace-local path dependencies, not crates.io ones.
[patch.crates-io]
gltf = { path = "../gltf" }
